<!doctype html>
<meta charset="utf-8">
<title>IDEF0 golden fixtures</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; color: #1a1c1f; }
  h1 { font: 600 18px system-ui, sans-serif; }
  .ok { color: #3d6b4a; } .err { color: #9c3327; }
</style>
<h1>Regenerating the Swift parity fixtures from the web app</h1>
<p>Serve with <code>python3 macos/scripts/fixture_server.py</code> and open this page. It runs the web app's own
modules and writes every golden file into <code>macos/Tests/IDEF0CoreTests/Fixtures/</code>.</p>
<pre id="log">working…</pre>

<script type="module">
// The reference behaviour for the Swift port. Every value here comes from the
// web app's modules; the Swift tests replay the same scenarios and compare.
// Regenerating changes the sample's random ids, and every golden with them,
// consistently — no Swift test depends on a particular id.

const logEl = document.getElementById('log');
const lines = [];
const say = (s, cls = '') => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s); logEl.innerHTML = lines.join('\n'); };

try {
  const M = await import('/src/model/model.js');
  const G = await import('/src/model/geometry.js');
  const T = await import('/src/model/types.js');
  const C = await import('/src/model/concepts.js');
  const V = await import('/src/model/validate.js');
  const S = await import('/src/model/sample.js');
  const J = await import('/src/io/json.js');
  const X = await import('/src/io/idef0xml.js');
  const R = await import('/src/io/report.js');
  const U = await import('/src/util.js');
  const RN = await import('/src/ui/render.js');
  // F88: the scenario DSL, apply() and computeAll() live in one DOM-free
  // module shared with tests/web's staleness suite, so both replay exactly
  // the same logic rather than two hand-kept copies that could drift apart.
  const H = await import('/macos/scripts/golden-harness.js');

  // F86: a non-2xx response used to only be styled red in the log; the run
  // still ended '/__done/ok'. Throwing here sends it to the catch block below
  // instead, which reports '/__done/error' — so a rejected fixture write
  // fails the whole regeneration rather than silently leaving that one file
  // stale (or, worse, since fixture_server.py now stages into a fresh temp
  // directory, simply missing from the stage).
  const post = async (name, text) => {
    const r = await fetch('/__fixture/' + name, { method: 'POST', body: text });
    const body = await r.text();
    say(`${name}: ${body}`, r.ok ? 'ok' : 'err');
    if (!r.ok) throw new Error(`POST /__fixture/${name} failed: ${r.status} ${body}`);
  };

  /* ---------------- the canonical sample file ---------------- */
  const built = C.bindAll(J.deserialize(J.serialize(S.buildSampleModel())));
  built.created = '2026-09-14';
  built.revised = '2026-09-14';
  const sampleText = J.serialize(built);
  await post('sample.idef0.json', sampleText);
  const load = () => C.bindAll(J.deserialize(sampleText));

  // F88: the scenario DSL lives in one DOM-free module (golden-harness.js)
  // shared with tests/web/goldens-staleness.test.mjs, so both stay honest
  // against the same op replay.
  const scenarios = H.scenarios;
  await post('scenarios.json', JSON.stringify(scenarios, null, 2));

  const apply = H.apply;
  const fixedIds = H.fixedIdsFor(sampleText);
  const normalize = (text) => H.normalize(text, fixedIds);
  const computeAll = H.computeAll;
  // Used further down (the label-placement battery) to find a diagram or
  // arrow the same way apply()'s ops do.
  const { byNode, arrowByLabel } = H;

  const goldenScenarios = {};
  for (const sc of scenarios) {
    const m = load();
    for (const op of sc.ops) apply(m, op);
    goldenScenarios[sc.name] = JSON.parse(normalize(JSON.stringify(computeAll(m))));
  }
  await post('golden-scenarios.json', JSON.stringify(goldenScenarios));

  /* ---------------- geometry batteries ---------------- */
  const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
  const sides = ['left', 'top', 'right', 'bottom'];
  const routes = [];
  for (let i = 0; i < 500; i += 1) {
    const nb = 1 + Math.floor(rnd(i * 7 + 1) * 5);
    const boxes = [];
    for (let k = 0; k < nb; k += 1) boxes.push({ id: 'b' + k, x: 60 + rnd(i * 13 + k) * 820, y: 150 + rnd(i * 17 + k) * 480, w: 110 + rnd(i * 19 + k) * 100, h: 70 + rnd(i * 23 + k) * 60 });
    const mk = (seed) => { const side = sides[Math.floor(rnd(seed + 1) * 4)]; const pos = rnd(seed + 2) * 1.04 - 0.02; return rnd(seed) < 0.25 ? { type: 'boundary', side, pos } : { type: 'box', boxId: 'b' + Math.floor(rnd(seed + 3) * nb), side, pos }; };
    const from = mk(i * 29 + 3), to = mk(i * 31 + 5);
    const bend = rnd(i * 37) < 0.2 ? 100 + rnd(i * 41) * 900 : null;
    const dg = { boxes, arrows: [] };
    const A = G.anchorOf(dg, from), B = G.anchorOf(dg, to);
    const pts = G.routePoints(A, B, bend, boxes);
    routes.push({
      boxes, from, to, bend, A, B, pts, path: G.pointsToPath(pts), mid: G.longestSegmentMid(pts), len: G.pathLength(pts),
      at25: G.pointAt(pts, 0.25), dist: G.distToPolyline(pts, { x: 550, y: 440 }),
      // F66: the same query point's nearest point on the route.
      nearestPt: G.nearestPointOnPolyline(pts, { x: 550, y: 440 }),
    });
  }
  const nearest = [];
  for (let i = 0; i < 200; i += 1) {
    const rect = { x: 100 + rnd(i) * 600, y: 150 + rnd(i + 1) * 400, w: 110 + rnd(i + 2) * 120, h: 70 + rnd(i + 3) * 80 };
    const pt = { x: rect.x - 40 + rnd(i + 4) * (rect.w + 80), y: rect.y - 40 + rnd(i + 5) * (rect.h + 80) };
    nearest.push({ rect, pt, ns: G.nearestSide(rect, pt), inRect: G.pointInRect(rect, pt) });
  }

  /* ---------------- routing edge cases (F57, F58): flush and near-edge
   * boxes on every side, facing ends closer than two stubs, and an L-route
   * that would otherwise cross its own target box. goldens.html's random
   * battery above never places a box flush against the drawing area
   * (x >= 60, y >= 150), so these are hand-placed. */
  const { WORK } = T;
  const edgeCase = (name, boxes, from, to) => {
    const dg = { boxes, arrows: [] };
    const A = G.anchorOf(dg, from), B = G.anchorOf(dg, to);
    const pts = G.routePoints(A, B, null, boxes);
    return { name, boxes, from, to, A, B, pts, path: G.pointsToPath(pts), mid: G.longestSegmentMid(pts) };
  };
  const edgeCases = [
    // A top-boundary input 40 units above a box flush with it: facing ends
    // closer than two stub-lengths (F58 item 1) — the sample's own C1 shape.
    edgeCase('top-facing-close',
      [{ id: 'e0', x: 300, y: WORK.y + 40, w: 190, h: 112 }],
      { type: 'boundary', side: 'top', pos: 0.2 }, { type: 'box', boxId: 'e0', side: 'top', pos: 0.5 }),
    // A box flush with the top edge (zero gap): the frame clamp (item 2)
    // keeps the approach stub off the header band.
    edgeCase('top-flush-clamp',
      [{ id: 'e0b', x: 300, y: WORK.y, w: 190, h: 112 }],
      { type: 'boundary', side: 'top', pos: 0.2 }, { type: 'box', boxId: 'e0b', side: 'top', pos: 0.5 }),
    // A left-boundary input to a box flush with the left edge: the
    // degenerate boundary-source case (item 3) — the stress2 "Customer
    // Order" shape — draws a bracket in the margin instead of a loop
    // outside the frame or a route back through the box.
    edgeCase('left-flush-degenerate',
      [{ id: 'e1', x: WORK.x, y: 400, w: 190, h: 112 }],
      { type: 'boundary', side: 'left', pos: 0.4 }, { type: 'box', boxId: 'e1', side: 'left', pos: 0.5 }),
    // The same degenerate source, entering the box's top face instead of its
    // left: the source is still excluded from the feedback test even though
    // the target's own orientation differs (h1 false).
    edgeCase('left-flush-degenerate-vertical-target',
      [{ id: 'e2', x: WORK.x, y: 400, w: 190, h: 112 }],
      { type: 'boundary', side: 'left', pos: 0.42 }, { type: 'box', boxId: 'e2', side: 'top', pos: 0.05 }),
    // A box flush with the right edge, its own output back to the right
    // boundary: the frame clamp on the far side.
    edgeCase('right-flush-clamp',
      [{ id: 'e3', x: WORK.x2 - 190, y: 300, w: 190, h: 112 }],
      { type: 'box', boxId: 'e3', side: 'right', pos: 0.5 }, { type: 'boundary', side: 'right', pos: 0.4 }),
    // A box flush with the bottom edge, its own output back to the bottom
    // boundary: the frame clamp on the footer side.
    edgeCase('bottom-flush-clamp',
      [{ id: 'e4', x: 400, y: WORK.y2 - 112, w: 190, h: 112 }],
      { type: 'box', boxId: 'e4', side: 'bottom', pos: 0.5 }, { type: 'boundary', side: 'bottom', pos: 0.5 }),
    // Two boxes 20 units apart, output facing input (F58 item 1): reach only
    // the midline, rather than the old down-and-under loop this pair used to
    // draw (a forward gap this narrow satisfied the old feedback test too).
    edgeCase('facing-close-hh',
      [{ id: 'e5', x: 300, y: 300, w: 190, h: 112 }, { id: 'e6', x: 300 + 190 + 20, y: 300, w: 190, h: 112 }],
      { type: 'box', boxId: 'e5', side: 'right', pos: 0.3 }, { type: 'box', boxId: 'e6', side: 'left', pos: 0.7 }),
    // The vertical equivalent: two boxes 15 units apart, top to bottom.
    edgeCase('facing-close-vv',
      [{ id: 'e7', x: 300, y: 300, w: 190, h: 112 }, { id: 'e8', x: 300, y: 300 + 112 + 15, w: 190, h: 112 }],
      { type: 'box', boxId: 'e7', side: 'bottom', pos: 0.3 }, { type: 'box', boxId: 'e8', side: 'top', pos: 0.7 }),
    // An output whose one-corner route would climb through the target box
    // from below to reach its bottom face (the "Tooling" shape) — routed
    // around it with a Z instead (F57).
    edgeCase('z-route-right-to-bottom',
      [{ id: 'e9', x: 40, y: 250, w: 190, h: 112 }, { id: 'e10', x: 330, y: 300, w: 190, h: 112 },
        { id: 'e11', x: 600, y: 560, w: 190, h: 112 }],
      { type: 'box', boxId: 'e9', side: 'right', pos: 0.5 }, { type: 'box', boxId: 'e11', side: 'bottom', pos: 0.5 }),
    // The mirror image: a route that would dip through the target box from
    // above to reach its top face (the "Work Order" shape).
    edgeCase('z-route-right-to-top',
      [{ id: 'e12', x: 40, y: 250, w: 190, h: 112 }, { id: 'e13', x: 330, y: 300, w: 190, h: 112 },
        { id: 'e14', x: 600, y: 110, w: 190, h: 112 }],
      { type: 'box', boxId: 'e12', side: 'right', pos: 0.5 }, { type: 'box', boxId: 'e14', side: 'top', pos: 0.5 }),
    // A vertical-to-horizontal route (source bottom, target left) that would
    // otherwise cross the target box on its way down: F57's other mixed
    // branch, the symmetric rule on x instead of y.
    edgeCase('z-route-bottom-to-left',
      [{ id: 'e15', x: 150, y: 200, w: 190, h: 112 }, { id: 'e16', x: 100, y: 380, w: 190, h: 112 }],
      { type: 'box', boxId: 'e15', side: 'bottom', pos: 0.5 }, { type: 'box', boxId: 'e16', side: 'left', pos: 0.3 }),
    // Its mirror image: source top, target right.
    edgeCase('z-route-top-to-right',
      [{ id: 'e17', x: 150, y: 450, w: 190, h: 112 }, { id: 'e18', x: 100, y: 200, w: 190, h: 112 }],
      { type: 'box', boxId: 'e17', side: 'top', pos: 0.5 }, { type: 'box', boxId: 'e18', side: 'right', pos: 0.7 }),
  ];
  await post('golden-edge-cases.json', JSON.stringify(edgeCases));

  /* ---------------- lane groups (F61): parallel arrows between the same
   * faces are spread into separate lanes; arrows that fork or join (share an
   * end anchor) are left drawn on top of one another; a pinned bend is
   * excluded and does not count against its neighbours' group. */
  const laneGroup = (name, boxes, arrows) => {
    const dg = { boxes, arrows };
    const routes = {};
    for (const a of arrows) routes[a.id] = G.routeArrow(dg, a);
    return { name, boxes, arrows, routes };
  };
  const lgB1 = { id: 'b1', x: 100, y: 280, w: 190, h: 112 };
  const lgB2 = { id: 'b2', x: 400, y: 400, w: 190, h: 112 };
  const laneGroups = [
    // The "rl" shape: two outputs of one box feeding two inputs of the next,
    // offset vertically enough that the old fixed midpoint drew them as one
    // overlapping line.
    laneGroup('rl-pair', [lgB1, lgB2], [
      { id: 'a1', label: 'Parts', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.35 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.5 }, bend: null },
      { id: 'a2', label: 'Subassemblies', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.6 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.85 }, bend: null },
    ]),
    // Two arrows sharing their source anchor exactly — a drawn fork — keep
    // one overlapping route rather than being spread apart.
    laneGroup('fork-shared-source', [lgB1, lgB2], [
      { id: 'f1', label: 'Fork1', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.5 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.3 }, bend: null },
      { id: 'f2', label: 'Fork2', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.5 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.7 }, bend: null },
    ]),
    // Three arrows between the same faces: two fork at the source (f1, f2)
    // and do not spread apart from each other, but neither shares an anchor
    // with p1, so all three still collide and land in one three-lane group —
    // colliding is transitive, so the group (and each member's place in it)
    // comes out the same no matter which member is asked.
    laneGroup('fork-plus-third', [lgB1, lgB2], [
      { id: 'p1', label: 'Parts', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.35 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.5 }, bend: null },
      { id: 'p2', label: 'Subassemblies', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.6 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.85 }, bend: null },
      { id: 'p3', label: 'Fork1', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.6 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.2 }, bend: null },
    ]),
    // A pinned bend keeps its exact position and is excluded from grouping —
    // it neither moves itself nor shifts the arrow it would otherwise
    // collide with.
    laneGroup('pinned-excluded', [lgB1, lgB2], [
      { id: 'q1', label: 'Pinned', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.35 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.5 }, bend: 260 },
      { id: 'q2', label: 'Free', from: { type: 'box', boxId: 'b1', side: 'right', pos: 0.6 }, to: { type: 'box', boxId: 'b2', side: 'left', pos: 0.85 }, bend: null },
    ]),
  ];
  await post('golden-lane-groups.json', JSON.stringify(laneGroups));
  const staircase = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({ n, rects: M.staircaseLayout(n) }));
  const reading = [];
  for (let i = 0; i < 120; i += 1) {
    const n = 2 + Math.floor(rnd(i * 3) * 5);
    const boxes = [];
    for (let k = 0; k < n; k += 1) boxes.push({ id: 'r' + k, x: 60 + rnd(i * 5 + k) * 850, y: 150 + rnd(i * 11 + k) * 500, w: 120, h: 80, number: 0 });
    reading.push({ boxes, order: M.boxReadingOrder(boxes).map((b) => b.id) });
  }
  const free = [];
  for (let i = 0; i < 60; i += 1) {
    const used = Array.from({ length: Math.floor(rnd(i) * 8) }, (_, k) => Math.round(rnd(i * 9 + k) * 100) / 100);
    const dg = { arrows: used.map((p) => ({ from: { type: 'boundary', side: 'left', pos: p }, to: { type: 'box', boxId: 'x', side: 'top', pos: 0.5 } })) };
    free.push({ used, pos: M.freePos(dg, (e) => e.type === 'boundary' && e.side === 'left') });
  }
  await post('golden-geometry.json', JSON.stringify({ routes, nearest, staircase, reading, free }));

  /* ---------------- label placement (F59, F66): labelPlacement auto-places
   * clear of boxes, ICOM codes and the frame; labelPosition chooses between
   * that and the legacy base plus a manual ldx/ldy; squigglePoints links a
   * far-off manual label back to its route. Same arithmetic in both apps, so
   * a modeller sees the same placement, and the same squiggle, either way. */
  const labelFor = (dg, icomEnds, boxes, a) => {
    const pts = G.routeArrow(dg, a);
    const width = U.textWidth(a.label, 10.5);
    const auto = G.labelPlacement(pts, a.label, { icomEnds, boxes });
    const base = G.legacyLabelBase(pts);
    const displayed = G.labelPosition(pts, a, { icomEnds, boxes });
    return {
      id: a.id, label: a.label, ldx: a.ldx, ldy: a.ldy, pts, auto, base, displayed,
      rect: G.labelRect(displayed, width), squiggle: G.squigglePoints(pts, displayed, width),
    };
  };

  // Every labelled arrow of every sample diagram, in its real box and ICOM
  // context (icomRects itself frame-clamps I1/I2/C1/C2/M1/M2, whose boundary
  // position sits at clamp01's 0.02 minimum, close enough to the edge that
  // this fixture alone proves the clamp). This is what fixes the shipped
  // 'Customer Order'/I1 collision and the 'Finished Product'/'Shipping
  // Notice' frame overflow.
  const labelSample = load();
  const labelDiagrams = [];
  for (const dg of Object.values(labelSample.diagrams)) {
    const icomEnds = RN.icomRects(labelSample, dg);
    const boxes = dg.boxes.map(G.rectOf);
    labelDiagrams.push({
      node: dg.node, icomEnds, boxes,
      arrows: dg.arrows.filter((a) => a.label).map((a) => labelFor(dg, icomEnds, boxes, a)),
    });
  }

  // The same two arrows, manually dragged: a small offset (still near its
  // route, no squiggle) and a large one (far from it, a squiggle back).
  // Applied to a deep clone of A0 — not the loaded model above — so `a` stays
  // a real member of `dgClone.arrows` (routeArrow's own lane-offset grouping
  // keys off `diagram.arrows.includes(arrow)`) while the sample-diagram
  // battery above stays at ldx = ldy = 0 throughout.
  const draggedCases = [];
  for (const [label, ldx, ldy] of [['Customer Order', 10, -6], ['Customer Order', 90, 60], ['Raw Materials', 0, 40]]) {
    const dgClone = U.deepClone(byNode(labelSample, 'A0'));
    const a = arrowByLabel(dgClone, label);
    a.ldx = ldx; a.ldy = ldy;
    const icomEnds = RN.icomRects(labelSample, dgClone);
    const boxes = dgClone.boxes.map(G.rectOf);
    draggedCases.push({ label, ldx, ldy, ...labelFor(dgClone, icomEnds, boxes, a) });
  }

  // Hand-built routes exercise cases the sample model may not: a clean
  // candidate identical to the pre-F59 fixed offset, a tie between two equal
  // segments, a vertical run whose start-anchored side collides so the
  // end-anchored one wins, and two diagrams cramped enough that every
  // candidate collides with something — where the frame/ICOM/box penalty
  // weights decide which collision the reader has to live with.
  const battery = [];
  const bcase = (name, pts, text, icomEnds = [], boxes = []) => {
    const width = U.textWidth(text, 10.5);
    const placement = G.labelPlacement(pts, text, { icomEnds, boxes });
    battery.push({ name, pts, text, icomEnds, boxes, placement, rect: G.labelRect(placement, width) });
  };
  // No boxes or codes nearby: the longest segment's default (above it, since
  // it is horizontal) wins outright, exactly as the pre-F59 fixed offset did.
  bcase('clean-horizontal-default', [{ x: 300, y: 400 }, { x: 500, y: 400 }, { x: 500, y: 300 }], 'Clean Label');
  // A vertical run whose start-anchored (+12) side runs into a box immediately
  // to its right: the end-anchored (-12) side is clear and wins.
  bcase('vertical-start-blocked-by-box', [{ x: 400, y: 300 }, { x: 400, y: 400 }, { x: 500, y: 400 }],
    'Vertical Label', [], [{ x: 405, y: 340, w: 190, h: 112 }]);
  // Two equal-length horizontal segments: the tie goes to the earlier one, as
  // longestSegmentMid's own '>' comparison would; a box only over the second
  // segment cannot change that when the first is already clean.
  bcase('tie-break-keeps-earlier-segment',
    [{ x: 100, y: 300 }, { x: 200, y: 300 }, { x: 200, y: 260 }, { x: 300, y: 260 }], 'Tie Segment',
    [], [{ x: 190, y: 230, w: 100, h: 60 }]);
  // A wide label whose fixed-offset default would overlap an ICOM code
  // exactly where 'Customer Order'/I1 used to: the fix moves it, rather than
  // accepting glyphs the code garbles.
  bcase('icom-collision-avoided',
    [{ x: 40, y: 244 }, { x: 70, y: 244 }, { x: 70, y: 228 }, { x: 100, y: 228 }], 'Customer Order',
    [{ x: 28, y: 233, w: 11, h: 12 }], []);
  // Every candidate collides with something: the frame penalty (3) outweighs
  // a box penalty (1), so the end-anchored candidate — off the frame, over a
  // box — wins over the start-anchored one that would run off the sheet, the
  // 'Finished Product' shape from the shipped sample.
  bcase('all-candidates-collide-frame-outweighs-box',
    [{ x: 1000, y: 591.2 }, { x: 1030, y: 591.2 }, { x: 1030, y: 629.6 }, { x: 1060, y: 629.6 }], 'Finished Product',
    [{ x: 1061.164, y: 618.6, w: 10.836, h: 12 }], [{ x: 810, y: 552, w: 190, h: 112 }]);
  // An ICOM penalty (2) still outweighs a box penalty (1): the longest
  // segment's own default (above it) collides with the ICOM band and is
  // passed over for the same segment's other side (below it), which only
  // collides with the box — even though every other candidate collides with
  // the box too, so nothing here wins by being the sole clean option.
  bcase('icom-penalty-outweighs-box',
    [{ x: 300, y: 300 }, { x: 400, y: 300 }, { x: 400, y: 340 }, { x: 500, y: 340 }], 'Weighted Label',
    [{ x: 280, y: 281, w: 240, h: 16 }], [{ x: 280, y: 300, w: 240, h: 60 }]);
  // A long label near the right edge whose start-anchored default (running
  // rightward, off the sheet) would cross the frame: the end-anchored side
  // of the same vertical run, running back over the drawing area, is clear.
  bcase('long-label-clamped-inside-frame',
    [{ x: 1000, y: 500 }, { x: 1030, y: 500 }, { x: 1030, y: 600 }, { x: 1060, y: 600 }],
    'A Rather Long Descriptive Arrow Label');
  await post('golden-labels.json', JSON.stringify({ diagrams: labelDiagrams, dragged: draggedCases, battery }));

  /* ---------------- squiggles (F66): a manually placed label far enough
   * from its route gets a short zig-zag back to it; one close enough — or
   * still auto-placed, which is always close enough — gets none. */
  const squiggleCases = [];
  const scase = (name, pts, pos, text) => {
    const width = U.textWidth(text, 10.5);
    squiggleCases.push({
      name, pts, pos, width, nearest: G.nearestPointOnPolyline(pts, pos), squiggle: G.squigglePoints(pts, pos, width),
    });
  };

  // label alike — the code's own 'icom' class does not make it an arrow's),
  // a `.arrow[data-arrow]` ancestor is that arrow's strokes, and a
  // `.arrow-annotations[data-arrow]` ancestor is that arrow's label/squiggle
  // or (if the element's own class says 'icom') its ICOM code.
  const classifyRenderRole = (el) => {
    let n = el.parentNode;
    while (n && n.nodeType === 1) {
      if (n.classList?.contains('frame-layer')) return { role: 'sheet', id: null };
      if (n.hasAttribute?.('data-box')) return { role: 'box', id: n.getAttribute('data-box') };
      if (n.hasAttribute?.('data-port')) return { role: 'port', id: n.getAttribute('data-port') };
      if (n.classList?.contains('arrow') && n.hasAttribute('data-arrow')) return { role: 'arrow', id: n.getAttribute('data-arrow') };
      if (n.classList?.contains('arrow-annotations') && n.hasAttribute('data-arrow')) {

        return { role: own.includes('icom') ? 'icom' : 'arrowLabel', id: n.getAttribute('data-arrow') };

  const collectRenderOps = (el, ops) => {

  // child, so it draws a port per parent ICOM entry (I1, C1, O1) — a dashed
  // stub, an open ring, the code at the edge and the label beside the ring.
  // The child's fresh box ids are random in both apps, so both give them
  // the same fixed spelling (no arrow refers to them).
  {
    const m = load();
    H.apply(m, { op: 'decompose', diagram: 'A0', name: 'Plan Production', count: 3 });
    byNode(m, 'A1').boxes.forEach((b, i) => { b.id = 'bx_rndp' + (i + 1); });
    renderCases.push(renderModelCase('render-ports', m));
  }

  // S01 bundles: Customer Order and Raw Materials combined into "Inputs" —
  // on A-0 the pair runs between the same faces and draws once, labelled
  // with the bundle's term (Raw Materials draws nothing); on A0 the two
  // branches reach different boxes and each draws alone, keeping its own
  // specific label (FIPS 183 §3.2.2.3: the general label on the bundle, the
  // specific ones on its branches).
  {
    const m = load();
    C.combineConcepts(m, ['Customer Order', 'Raw Materials'].map((t) => C.findConcept(m, t).id), 'Inputs');
    renderCases.push(renderModelCase('render-bundle', m));
  }

  // S02 forks and joins: the 'fork-join-drawn' scenario's model — the
  // sample's three Work Orders forking off Plan Production, two Inspection
  // Reports joining at Ship Product's top, and a Customer Order copy forking
  // off the left edge — each group drawn as one trunk with branches and one
  // label, checked against SheetDrawing.build op for op.
  {
    const m = load();
    for (const op of H.scenarios.find((sc) => sc.name === 'fork-join-drawn').ops) H.apply(m, op);
    renderCases.push(renderModelCase('render-fork-join', m));
  }

  await post('golden-render.json', JSON.stringify(renderCases));

  const idempotent = J.serialize(load()) === sampleText;
  say(`\nDone. JS idempotent on the sample: ${idempotent}`, idempotent ? 'ok' : 'err');
  // F86: a non-idempotent serialize is a lossless-round-trip failure — a
  // data-integrity property, for a tool whose whole job is data integrity —
  // and it used to still post '/__done/ok'. Throwing sends it to '/__done/error'
  // instead, so regen-goldens.sh exits non-zero rather than reporting success.
  if (!idempotent) throw new Error('serialize(load()) is not idempotent on the sample; see F86');
  await fetch('/__done/ok', { method: 'POST', body: `idempotent=${idempotent}` });
} catch (e) {
  say(String(e.stack || e), 'err');
  await fetch('/__done/error', { method: 'POST', body: String(e.stack || e) });
}
</script>
